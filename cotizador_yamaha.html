<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Yamaha — De Los Ángeles Motor's</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Barlow:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0c; --surface: #13131a; --surface2: #1c1c26;
  --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.13);
  --accent: #1c6ef3; --yamaha-red: #e6001e;
  --green: #00d2ff; --green-soft: rgba(0, 210, 255, 0.12);
  --text: #eeeef2; --muted: #7070a0; --r: 14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100vh;display:flex;flex-direction:column;position:relative}

/* Header UI */
.header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-y{background:var(--yamaha-red);color:white;font-family:'Barlow',sans-serif;font-weight:700;font-size:13px;padding:4px 8px;border-radius:6px}
.logo-text{font-family:'Barlow',sans-serif;font-weight:600;font-size:14px}
.header-actions{display:flex;align-items:center;gap:8px}
.btn-icon{background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;transition:all 0.15s}
.btn-icon:hover{border-color:var(--yamaha-red)}
.step-pill{font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:4px 10px}
.step-pill span{color:var(--text);font-weight:500}
.progress-bar-wrap{height:3px;background:var(--surface2)}
.progress-bar{height:100%;background:var(--yamaha-red);transition:width 0.4s ease}

/* Chat & Widgets */
.chat{flex:1;padding:16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding-bottom:20px}
.bubble{max-width:88%;padding:11px 14px;border-radius:16px;font-size:13.5px;line-height:1.5;animation:pop 0.2s cubic-bezier(0.34,1.56,0.64,1) both}
@keyframes pop{from{opacity:0;transform:scale(0.92) translateY(6px)}to{opacity:1;transform:none}}
.bubble.agent{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px;align-self:flex-start}
.bubble.user{background:var(--accent);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.typing{display:flex;gap:4px;align-items:center;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:16px;border-bottom-left-radius:4px;width:fit-content}
.typing span{width:5px;height:5px;background:var(--muted);border-radius:50%;animation:tb 1.2s ease infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes tb{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.widget{width:100%;animation:pop 0.25s ease both}

/* Catálogo & Cards */
.cat-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cat-scroll::-webkit-scrollbar{display:none}
.cat-btn{flex-shrink:0;padding:7px 13px;border-radius:20px;font-size:12px;font-weight:500;border:1px solid var(--border2);background:var(--surface);color:var(--muted);cursor:pointer;transition:all 0.15s}
.cat-btn.active{background:var(--yamaha-red);border-color:var(--yamaha-red);color:#fff}
.moto-list{display:flex;flex-direction:column;gap:10px;margin-top:10px}

/* TARJETA DE MOTOCICLETA CON FOTOGRAFÍA */
.moto-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:all 0.15s;position:relative;overflow:hidden}
.moto-card:hover{border-color:var(--green)}
.moto-card:active{border-color:var(--green);transform:scale(0.99)}

.moto-card-header{display:flex;align-items:center;gap:12px}
.moto-img-container{width:110px;height:75px;border-radius:10px;background:#0d0d12;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;border:1px solid var(--border2)}
.moto-img-container img{width:100%;height:100%;object-fit:contain;padding:2px}
.moto-icon-fallback{font-size:32px}

.moto-body{flex:1;min-width:0}
.moto-name{font-family:'Barlow',sans-serif;font-weight:700;font-size:15px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.moto-sub{font-size:11px;color:var(--muted);margin-top:2px}

.moto-price-col{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0}
.moto-price{font-family:'Barlow',sans-serif;font-weight:700;font-size:15px;color:var(--green) !important}
.moto-price-orig{font-size:11px;color:var(--muted);text-decoration:line-through}
.bono-tag{font-size:8.5px;color:var(--yamaha-red);background:rgba(230,0,30,0.15);padding:1px 5px;border-radius:4px;font-weight:700;margin-top:2px;white-space:nowrap !important}

/* Selector de colores */
.color-pills{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-top:4px;border-top:1px solid var(--border)}
.color-pill{font-size:10px;padding:3px 8px;border-radius:12px;background:var(--surface2);color:var(--muted);border:1px solid var(--border2);cursor:pointer;transition:all 0.12s}
.color-pill.active{background:rgba(0,210,255,0.15);color:var(--green);border-color:var(--green);font-weight:600}

.opts{display:flex;flex-direction:column;gap:8px}
.opt-btn{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);padding:12px 14px;color:var(--text);font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:10px;text-align:left;transition:all 0.15s}
.opt-btn:hover{border-color:var(--accent)}
.opt-btn:active{background:var(--surface2)}
.opt-btn:disabled{opacity:0.4;pointer-events:none}
.opt-icon{font-size:18px;width:34px;height:34px;background:var(--surface2);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.cot{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.cot-head{background:var(--yamaha-red);padding:10px 14px;font-family:'Barlow',sans-serif;font-weight:600;font-size:13.5px}
.cot-body{padding:10px 14px}
.cot-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.cot-row:last-child{border-bottom:none}
.cot-label{color:var(--muted)}.cot-val{font-weight:500}
.cot-val.green{color:var(--green) !important}.cot-val.blue{color:#60a5fa}

/* Formulario Técnico / Captura */
.form-card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.form-title{font-family:'Barlow',sans-serif;font-weight:600;font-size:13px;color:var(--yamaha-red);text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border);padding-bottom:4px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form-group{display:flex;flex-direction:column;gap:3px}
.form-group.full{grid-column:span 2}
.field-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:500}
.field-input, .field-select{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:8px 10px;color:var(--text);font-size:13px;outline:none;width:100%}
.field-input:focus, .field-select:focus{border-color:var(--accent)}

.btn-primary{width:100%;background:var(--yamaha-red);color:white;border:none;border-radius:var(--r);padding:12px;font-size:14px;font-weight:500;cursor:pointer;transition:all 0.15s}
.btn-primary:active{opacity:0.85;transform:scale(0.99)}
.btn-secondary{background:var(--surface2) !important;color:var(--text) !important;border:1px solid var(--border2) !important}
.input-area{padding:10px 14px 20px;background:var(--bg);border-top:1px solid var(--border);display:flex;gap:8px;align-items:center}
.input-wrap{flex:1;background:var(--surface);border:1px solid var(--border2);border-radius:24px;display:flex;align-items:center;padding:8px 14px}
.input-wrap input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:13px}
.send-btn{width:36px;height:36px;border-radius:50%;background:var(--yamaha-red);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.send-btn svg{width:15px;height:15px;fill:white}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(4px);z-index:999;display:none;align-items:center;justify-content:center;padding:12px}
.modal-overlay.active{display:flex}
.modal-container{background:var(--surface);border:1px solid var(--border2);border-radius:16px;width:100%;max-width:540px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.modal-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-title{font-family:'Barlow',sans-serif;font-weight:600;font-size:15px}
.modal-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
.modal-body{padding:14px;overflow-y:auto;flex:1}

/* HOJA DE IMPRESIÓN (Plantilla Carta 1 Sola Página) */
.print-paper{background:white;color:#111;padding:10mm 12mm;margin:0 auto;width:100%;max-width:210mm;font-family:Arial,Helvetica,sans-serif;box-sizing:border-box;border-radius:4px}
.p-hdr{text-align:center;border-bottom:2px solid #e6001e;padding-bottom:5px;margin-bottom:6px}
.p-brand{font-size:18pt;font-weight:900;color:#e6001e;letter-spacing:-0.5px;line-height:1}
.p-dealer{font-size:9.5pt;font-weight:bold;color:#111;margin-top:2px}
.p-addr{font-size:7pt;color:#555;margin-top:2px}
.p-title{font-size:9.5pt;text-align:center;text-transform:uppercase;letter-spacing:0.8px;margin:5px 0;font-weight:bold;color:#222}
.p-table{width:100%;border-collapse:collapse;margin:3px 0}
.p-table tr{border-bottom:1px solid #e2e2e2}
.p-table td{padding:3px 5px;font-size:7.5pt}
.p-lbl{color:#444;width:55%}
.p-val{font-weight:bold;text-align:right}
.p-sec{background:#f0f0f0;padding:3px 5px;font-weight:bold;font-size:7.5pt;text-transform:uppercase;letter-spacing:.5px;color:#222;border-left:3px solid #e6001e;margin:5px 0 2px}
.p-req{font-size:6.8pt;color:#333;margin:2px 0;line-height:1.3;padding-left:12px}

.p-promo{background:#ecfdf5;border:1px solid #10b981;border-radius:5px;padding:4px 7px;margin:5px 0;font-size:7pt;color:#047857;display:flex;align-items:center;gap:5px}
.p-promo-badge{background:#10b981;color:white;font-weight:800;font-size:6pt;padding:1px 5px;border-radius:3px;text-transform:uppercase;letter-spacing:0.5px;flex-shrink:0}

.p-notas{font-size:5.2pt;color:#666;margin-top:5px;border-top:1px solid #e2e2e2;padding-top:3px;line-height:1.2}
.p-foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:6px;padding-top:4px;border-top:1.5px solid #e6001e}

@page {
  size: letter portrait;
  margin: 5mm 6mm;
}
@media print {
  body { background: white !important; color: black !important; }
  #app, .modal-overlay .modal-head, .modal-actions, .input-area { display: none !important; }
  .modal-overlay { position: static !important; inset: auto !important; background: none !important; display: block !important; padding: 0 !important; }
  .modal-container { border: none !important; max-width: 100% !important; max-height: none !important; border-radius: 0 !important; overflow: visible !important; }
  .modal-body { padding: 0 !important; overflow: visible !important; }
  .print-paper { width: 100% !important; max-width: 100% !important; padding: 0 !important; margin: 0 !important; max-height: 255mm !important; overflow: hidden !important; page-break-after: avoid !important; page-break-inside: avoid !important; }
}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="logo-wrap">
      <div class="logo-y">YAMAHA</div>
      <div class="logo-text">De Los Ángeles Motor's</div>
    </div>
    <div class="header-actions">
      <button class="btn-icon" onclick="abrirAdmin()">⚙️ Catálogo</button>
      <div class="step-pill">Paso <span id="stepLabel">1</span> de <span id="stepTotal">3</span></div>
    </div>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar" style="width:33%"></div></div>
  <div class="chat" id="chat"></div>
  <div class="input-area" id="inputArea" style="display:none">
    <div class="input-wrap"><input type="text" id="userInput" placeholder="Escribe aquí..." autocomplete="off"></div>
    <button class="send-btn" onclick="handleSend()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<!-- MODAL 1: PREVISUALIZACIÓN E IMPRESIÓN (1 HOJA CARTA) -->
<div class="modal-overlay" id="modalImpresion">
  <div class="modal-container">
    <div class="modal-head">
      <div class="modal-title">Previsualización de Documento</div>
      <button class="modal-close" onclick="cerrarModal('modalImpresion')">✕</button>
    </div>
    <div class="modal-body" id="printAreaContainer"></div>
    <div class="modal-actions" style="padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px">
      <button class="btn-primary" onclick="ejecutarImpresion()">🖨️ Imprimir</button>
      <button class="btn-primary btn-secondary" onclick="compartirDoc()">📲 Compartir</button>
    </div>
  </div>
</div>

<!-- MODAL 2: PANEL DE ADMINISTRACIÓN DE CATÁLOGO -->
<div class="modal-overlay" id="modalAdmin">
  <div class="modal-container">
    <div class="modal-head">
      <div class="modal-title">Gestión de Catálogo (Modelos, Precios y Bonos)</div>
      <button class="modal-close" onclick="cerrarModal('modalAdmin')">✕</button>
    </div>
    <div class="modal-body">
      <button class="btn-primary" style="margin-bottom:12px" onclick="formNuevoModelo()">+ Agregar Nueva Unidad</button>
      <div id="adminFormZone" style="display:none;margin-bottom:14px"></div>
      <div id="adminListZone"></div>
    </div>
  </div>
</div>

<script>
// IMAGEN OFICIAL YAMAHA XMAX NEGRA
const XMAX_BLACK_IMG = "https://images.unsplash.com/photo-1558981403-c5f9899a28bc?auto=format&fit=crop&w=600&q=80";

const CATALOGO_DEFAULT = [
  {
    id: "CZ300",
    clave: "CZD300BT",
    modelo: "X MAX (2026)",
    anio: 2026,
    precio: 172631,
    bono: 2000,
    categoria: "Scooter",
    icon: "🛵",
    colores: ["Negro", "Gris"],
    imagenes: {
      "Negro": XMAX_BLACK_IMG
    }
  },
  {id:"LCX125", clave:"LCX125BS",   modelo:"FASCINO",                  anio:2025, precio:49473,  bono:1000, categoria:"Scooter",     icon:"🛵", colores:["Azul Mate","Rojo"]},
  {id:"GPD155", clave:"GPD155BT",   modelo:"N-MAX (2026)",             anio:2026, precio:105262, bono:0,    categoria:"Scooter",     icon:"🛵", colores:["Blanco","Negro"]},
  {id:"YB125",  clave:"YB125BR",    modelo:"YB 125",                   anio:2025, precio:39999,  bono:0,    categoria:"Trabajo",     icon:"🏍️", colores:["Rojo","Negro"]},
  {id:"YBR125", clave:"YBR125CBS",  modelo:"YBR 125C EXPRESS (2026)",  anio:2026, precio:41052,  bono:0,    categoria:"Trabajo",     icon:"🏍️", colores:["Blanco","Rojo"]},
  {id:"FZSV3",  clave:"FZSBT",      modelo:"FZ S V3.0 (2026)",         anio:2026, precio:66315,  bono:1500, categoria:"Street",      icon:"🏍️", colores:["Negro Mate","Azul"]},
  {id:"FZ25",   clave:"FZ25BS6",    modelo:"FZ 25 ABS (2026)",         anio:2026, precio:94736,  bono:0,    categoria:"Street",      icon:"🏍️", colores:["Negro","Gris"]},
  {id:"MT15",   clave:"MTN155BT",   modelo:"MT-15 (2026)",             anio:2026, precio:103157, bono:0,    categoria:"Deportiva",   icon:"🏁", colores:["Cyan Storm","Ice Fluo"]},
  {id:"MT03",   clave:"MTN320BS",   modelo:"MT-03 ABS (2026)",         anio:2026, precio:165262, bono:3000, categoria:"Deportiva",   icon:"🏁", colores:["Negro","Azul Icon"]},
  {id:"R15",    clave:"YZFR15BT",   modelo:"YZF-R15 V4.0 (2026)",      anio:2026, precio:108420, bono:0,    categoria:"Super Dep.",  icon:"🏎️", colores:["Racing Blue","Negro"]},
  {id:"R7",     clave:"YZF69Z",     modelo:"YZF-R7 (2026)",            anio:2026, precio:289473, bono:0,    categoria:"Super Dep.",  icon:"🏎️", colores:["Azul","Negro"]},
  {id:"XTZ125", clave:"XTZ125EBT",  modelo:"XTZ 125E (2026)",          anio:2026, precio:53157,  bono:0,    categoria:"Doble Prop.", icon:"🏕️", colores:["Azul","Blanco"]},
  {id:"XTZ150", clave:"XTZ150EBT",  modelo:"XTZ 150 (2026)",           anio:2026, precio:70526,  bono:0,    categoria:"Doble Prop.", icon:"🏕️", colores:["Marrón","Azul"]},
  {id:"TEN700", clave:"TENERE700",  modelo:"Ténéré 700 (2026)",        anio:2026, precio:357894, bono:0,    categoria:"Doble Prop.", icon:"🏕️", colores:["Icon Blue","Tech Kamo"]}
];

const CatalogManager = {
  get: () => {
    const raw = localStorage.getItem('yamaha_catalogo');
    return raw ? JSON.parse(raw) : CATALOGO_DEFAULT;
  },
  save: (data) => {
    localStorage.setItem('yamaha_catalogo', JSON.stringify(data));
  },
  getCategories: () => {
    const items = CatalogManager.get();
    return [...new Set(items.map(i => i.categoria))];
  },
  add: (item) => {
    const data = CatalogManager.get();
    data.push({ ...item, id: 'ID_' + Date.now() });
    CatalogManager.save(data);
  },
  update: (id, updated) => {
    const data = CatalogManager.get().map(i => i.id === id ? { ...i, ...updated } : i);
    CatalogManager.save(data);
  },
  delete: (id) => {
    const data = CatalogManager.get().filter(i => i.id !== id);
    CatalogManager.save(data);
  }
};

const FinanceEngine = {
  pContadoBase: p => Math.round(p * 0.95),
  pContado:     (p, bono = 0) => Math.max(0, Math.round(p * 0.95) - (bono || 0)),
  p3meses:      p => p * 0.97,
  engMin:       p => p * 0.40,
  engMax:       p => Math.floor(p * 0.80),
  mensual3:     (p, e) => (FinanceEngine.p3meses(p) - e) / 3,
  mensualN:     (p, e, n) => ((p - e) * (1 + 0.02 * n)) / n,
  fmt:          n => '$' + Math.round(n).toLocaleString('es-MX')
};

const TODAY_FORMAT = new Date().toISOString().split('T')[0];
const TODAY_MX = new Date().toLocaleDateString('es-MX', { day: '2-digit', month: 'long', year: 'numeric' });

let step = 0, state = {};
let activeCat = CatalogManager.getCategories()[0] || 'Scooter';
let selectedColorByMoto = {};
let appMode = '';

const chat = document.getElementById('chat');
const inputArea = document.getElementById('inputArea');

function setProgress(s, total = 3) {
  document.getElementById('stepLabel').textContent = s;
  document.getElementById('stepTotal').textContent = total;
  document.getElementById('progressBar').style.width = (s / total * 100) + '%';
}
function hideInput() { inputArea.style.display = 'none'; }
function showInput(ph = 'Escribe aquí...') {
  inputArea.style.display = 'flex';
  const inp = document.getElementById('userInput');
  inp.placeholder = ph; inp.value = ''; inp.focus();
}
function addBubble(html, type = 'agent', delay = 0) {
  return new Promise(res => setTimeout(() => {
    const b = document.createElement('div'); b.className = 'bubble ' + type; b.innerHTML = html;
    chat.appendChild(b); chat.scrollTop = chat.scrollHeight; res();
  }, delay));
}
function addWidget(html, delay = 0) {
  return new Promise(res => setTimeout(() => {
    const w = document.createElement('div'); w.className = 'widget'; w.innerHTML = html;
    chat.appendChild(w); chat.scrollTop = chat.scrollHeight; res();
  }, delay));
}
function typing(ms = 250) {
  return new Promise(res => {
    const id = 'tp' + Date.now();
    const t = document.createElement('div'); t.className = 'typing'; t.id = id;
    t.innerHTML = '<span></span><span></span><span></span>';
    chat.appendChild(t); chat.scrollTop = chat.scrollHeight;
    setTimeout(() => { document.getElementById(id)?.remove(); res(); }, ms);
  });
}
function disableWidgets() { document.querySelectorAll('.opt-btn, .cat-btn, .moto-card').forEach(b => b.disabled = true); }

async function handleSend() {
  const inp = document.getElementById('userInput');
  const v = inp.value.trim(); if (!v) return; inp.value = '';
  await addBubble(v, 'user');
  if (step === 'cotAsesor') { state.asesor = v; await previsualizarCotizacion(); }
}
document.getElementById('userInput').addEventListener('keydown', e => { if (e.key === 'Enter') handleSend(); });

async function s0_bienvenida() {
  hideInput(); setProgress(1, 3);
  await typing(150);

          }
        </div>
        <div class="moto-body">

async function cotAjustar() {
  disableWidgets(); await addBubble('Ajustar enganche', 'user');
  const pL = state.moto.precio, min = FinanceEngine.engMin(pL), max = FinanceEngine.engMax(pL);
  await addWidget(`<div class="form-card">
    <div class="form-title" style="margin-bottom:2px">Ajuste de Enganche (Mín. 40% · Máx. 80%)</div>
    <div class="form-grid">
      <div class="form-group">
        <label class="field-label">Monto ($ MXN)</label>
        <input class="field-input" id="inputEngMonto" type="number" value="${Math.round(min)}" min="${min}" max="${max}" oninput="onEngMontoChange(this.value, ${pL})">
      </div>
      <div class="form-group">
        <label class="field-label">Porcentaje (%)</label>
        <input class="field-input" id="inputEngPct" type="number" value="40" min="40" max="80" step="0.5" oninput="onEngPctChange(this.value, ${pL})">
      </div>
    </div>
    <div id="engFeedback" style="font-size:12px;color:var(--green);font-weight:500">Enganche válido</div>
    <button class="btn-primary" onclick="cotConfirmarEng(${pL})">Aplicar Enganche</button>
  </div>`, 100);
  onEngMontoChange(Math.round(min), pL);
}

function updateEngFeedbackAndSummary(monto, pL) {
  const min = FinanceEngine.engMin(pL), max = FinanceEngine.engMax(pL);
  const fb = document.getElementById('engFeedback');
  if (!fb) return;
  if (monto >= min && monto <= max) {
    state.enganche = monto;
    fb.style.color = 'var(--green)';
    fb.textContent = `✓ 3m: ${FinanceEngine.fmt(FinanceEngine.mensual3(pL, monto))} | 6m: ${FinanceEngine.fmt(FinanceEngine.mensualN(pL, monto, 6))}`;
    renderCotResumen(pL, monto);
  } else {
    fb.style.color = 'var(--yamaha-red)';
    fb.textContent = monto < min ? `✗ Mínimo requerido: ${FinanceEngine.fmt(min)} (40%)` : `✗ Máximo permitido: ${FinanceEngine.fmt(max)} (80%)`;
  }
}

function onEngMontoChange(val, pL) {
  const monto = parseFloat(val) || 0;
  const pctInput = document.getElementById('inputEngPct');
  if (pctInput && document.activeElement !== pctInput) {
    const pct = pL > 0 ? (monto / pL * 100) : 0;
    pctInput.value = pct ? (Math.round(pct * 10) / 10) : '';
  }
  updateEngFeedbackAndSummary(monto, pL);
}

function onEngPctChange(val, pL) {
  const pct = parseFloat(val) || 0;
  const montoInput = document.getElementById('inputEngMonto');
  const monto = Math.round(pL * (pct / 100));
  if (montoInput && document.activeElement !== montoInput) {
    montoInput.value = monto || '';
  }
  updateEngFeedbackAndSummary(monto, pL);
}

async function cotConfirmarEng(pL) {
  const monto = parseFloat(document.getElementById('inputEngMonto')?.value) || 0;
  const min = FinanceEngine.engMin(pL), max = FinanceEngine.engMax(pL);
  if (monto < min || monto > max) return;
  state.enganche = monto;
  const pct = Math.round((monto / pL) * 100);
  await addBubble(`Enganche establecido en: ${FinanceEngine.fmt(monto)} (${pct}%)`, 'user');
  await cotPedirAsesor();
}

    <div class="cot-body">
      <div class="cot-row"><span class="cot-label">Cliente</span><span class="cot-val">${cliente.nombre}</span></div>
      <div class="cot-row"><span class="cot-label">Teléfono</span><span class="cot-val">${cliente.telefono}</span></div>
      <div class="cot-row"><span class="cot-label">Dirección</span><span class="cot-val">${cliente.direccion}, ${cliente.colonia}</span></div>
      <div class="cot-row"><span class="cot-label">Ciudad</span><span class="cot-val">${cliente.ciudad}</span></div>
      <div class="cot-row"><span class="cot-label">Fecha Venta</span><span class="cot-val">${cliente.fecha}</span></div>
      <div class="cot-row"><span class="cot-label">Modelo</span><span class="cot-val green">${unidad.modelo}</span></div>
      <div class="cot-row"><span class="cot-label">Color</span><span class="cot-val">${unidad.color}</span></div>
      <div class="cot-row">
        <span class="cot-label">Precio Contado</span>
        <span class="cot-val green">
          ${FinanceEngine.fmt(pFinalContado)}
          ${bono > 0 ? `<small style="color:var(--muted);text-decoration:line-through;margin-left:4px">${FinanceEngine.fmt(pBaseContado)}</small>` : ''}
        </span>
      </div>
      <div class="cot-row"><span class="cot-label">Cilindrada</span><span class="cot-val">${unidad.cilindrada || 'N/A'}</span></div>
      <div class="cot-row"><span class="cot-label">No. Motor</span><span class="cot-val">${unidad.noMotor || 'N/A'}</span></div>
      <div class="cot-row"><span class="cot-label">No. Serie</span><span class="cot-val">${unidad.noSerie || 'N/A'}</span></div>
      <div class="cot-row"><span class="cot-label">Pedimento</span><span class="cot-val">${unidad.noPedimento || 'N/A'} (${unidad.fechaPedimento})</span></div>
      <div class="cot-row"><span class="cot-label">Aduana</span><span class="cot-val">${unidad.aduana || 'N/A'}</span></div>
    </div>
  </div>
  <button class="btn-primary btn-secondary" style="margin-top:10px" onclick="reiniciar()">Nueva Operación</button>`;

  await addWidget(resumenHtml, 100);
}

function abrirModal(id) { document.getElementById(id).classList.add('active'); }
function cerrarModal(id) { document.getElementById(id).classList.remove('active'); }

function ejecutarImpresion() {
  window.print();
}

async function compartirDoc() {
  if (navigator.share) {
    try {
      await navigator.share({
        title: `Cotización Yamaha — ${state.moto.modelo}`,
        text: `Cotización para ${state.moto.modelo} en De Los Ángeles Motor's Tehuacán.`
      });
    } catch (e) {}
  } else {
    alert('Usa la opción de imprimir para guardar o compartir como PDF.');
  }
}

function abrirAdmin() {
  renderAdminList();
  abrirModal('modalAdmin');
}

function renderAdminList() {
  const data = CatalogManager.get();
  const listZone = document.getElementById('adminListZone');
  listZone.innerHTML = data.map(m => {
    const bono = m.bono || 0;
    return `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid var(--border);background:var(--surface2);border-radius:8px;margin-bottom:6px">
      <div>
        <div style="font-weight:600;font-size:13px">${m.modelo} <span style="color:var(--muted);font-size:11px">(${m.anio || 2026})</span></div>
        <div style="font-size:11px;color:var(--green)">
          Contado: ${FinanceEngine.fmt(FinanceEngine.pContado(m.precio, bono))}
          ${bono > 0 ? `<span style="color:var(--yamaha-red);margin-left:4px;font-weight:600">(Bono: ${FinanceEngine.fmt(bono)})</span>` : ''}
        </div>
        <div style="font-size:10px;color:var(--muted)">Lista: ${FinanceEngine.fmt(m.precio)} · ${m.categoria}</div>
        <div style="font-size:10px;color:var(--muted)">Colores: ${(m.colores || []).join(', ')}</div>
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn-icon" onclick="formEditarModelo('${m.id}')">✏️</button>
        <button class="btn-icon" style="color:var(--yamaha-red)" onclick="eliminarModelo('${m.id}')">🗑️</button>
      </div>
    </div>`;
  }).join('');
}

function formNuevoModelo() {
  const fz = document.getElementById('adminFormZone');
  fz.style.display = 'block';
  fz.innerHTML = `
  <div class="form-card" style="border-color:var(--yamaha-red)">
    <div class="form-title">Agregar Nueva Unidad</div>
    <div class="form-grid">
      <div class="form-group full"><label class="field-label">Nombre Modelo</label><input class="field-input" id="adm_mod" placeholder="Ej. YZF-R3 (2026)"></div>
      <div class="form-group"><label class="field-label">Clave</label><input class="field-input" id="adm_cla" placeholder="Clave"></div>
      <div class="form-group"><label class="field-label">Categoría</label><input class="field-input" id="adm_cat" placeholder="Scooter, Street..."></div>
      <div class="form-group"><label class="field-label">Precio Lista ($)</label><input class="field-input" id="adm_pre" type="number" placeholder="150000"></div>
      <div class="form-group"><label class="field-label">Bono Pago Contado ($)</label><input class="field-input" id="adm_bono" type="number" value="0" placeholder="0"></div>
      <div class="form-group"><label class="field-label">Año</label><input class="field-input" id="adm_yr" type="number" value="2026"></div>
      <div class="form-group full"><label class="field-label">Colores (separados por coma)</label><input class="field-input" id="adm_col" placeholder="Negro, Azul, Blanco"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:6px">
      <button class="btn-primary" onclick="guardarNuevoModelo()">Guardar Modelo</button>
      <button class="btn-primary btn-secondary" onclick="document.getElementById('adminFormZone').style.display='none'">Cancelar</button>
    </div>
  </div>`;
}

function guardarNuevoModelo() {
  const modelo = document.getElementById('adm_mod')?.value.trim();
  const clave = document.getElementById('adm_cla')?.value.trim() || '—';
  const categoria = document.getElementById('adm_cat')?.value.trim() || 'Street';
  const precio = parseFloat(document.getElementById('adm_pre')?.value) || 0;
  const bono = parseFloat(document.getElementById('adm_bono')?.value) || 0;
  const anio = parseInt(document.getElementById('adm_yr')?.value) || 2026;
  const colores = (document.getElementById('adm_col')?.value || 'Negro').split(',').map(s => s.trim()).filter(Boolean);

  if (!modelo || precio <= 0) {
    alert('Ingresa el nombre del modelo y un precio válido.');
    return;
  }

  CatalogManager.add({ clave, modelo, categoria, precio, bono, anio, colores, icon: '🏍️' });
  document.getElementById('adminFormZone').style.display = 'none';
  renderAdminList();
  renderCatalog();
}

function formEditarModelo(id) {
  const m = CatalogManager.get().find(x => x.id === id);
  if (!m) return;
  const fz = document.getElementById('adminFormZone');
  fz.style.display = 'block';
  fz.innerHTML = `
  <div class="form-card" style="border-color:var(--accent)">
    <div class="form-title">Editar Unidad: ${m.modelo}</div>
    <div class="form-grid">
      <div class="form-group full"><label class="field-label">Nombre Modelo</label><input class="field-input" id="adm_e_mod" value="${m.modelo}"></div>
      <div class="form-group"><label class="field-label">Precio Lista ($)</label><input class="field-input" id="adm_e_pre" type="number" value="${m.precio}"></div>
      <div class="form-group"><label class="field-label">Bono Pago Contado ($)</label><input class="field-input" id="adm_e_bono" type="number" value="${m.bono || 0}"></div>
      <div class="form-group"><label class="field-label">Año</label><input class="field-input" id="adm_e_yr" type="number" value="${m.anio || 2026}"></div>
      <div class="form-group full"><label class="field-label">Colores (separados por coma)</label><input class="field-input" id="adm_e_col" value="${(m.colores || []).join(', ')}"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:6px">
      <button class="btn-primary" onclick="guardarEdicionModelo('${m.id}')">Actualizar</button>
      <button class="btn-primary btn-secondary" onclick="document.getElementById('adminFormZone').style.display='none'">Cancelar</button>
    </div>
  </div>`;
}

function guardarEdicionModelo(id) {
  const modelo = document.getElementById('adm_e_mod')?.value.trim();
  const precio = parseFloat(document.getElementById('adm_e_pre')?.value) || 0;
  const bono = parseFloat(document.getElementById('adm_e_bono')?.value) || 0;
  const anio = parseInt(document.getElementById('adm_e_yr')?.value) || 2026;
  const colores = (document.getElementById('adm_e_col')?.value || '').split(',').map(s => s.trim()).filter(Boolean);

  CatalogManager.update(id, { modelo, precio, bono, anio, colores });
  document.getElementById('adminFormZone').style.display = 'none';
  renderAdminList();
  renderCatalog();
}

function eliminarModelo(id) {
  if (confirm('¿Deseas eliminar esta unidad del catálogo?')) {
    CatalogManager.delete(id);
    renderAdminList();
    renderCatalog();
  }
}

async function reiniciar() {
  state = {}; step = 0; appMode = '';
  chat.innerHTML = '';
  s0_bienvenida();
}

window.onload = function() {
  s0_bienvenida();
};
</script>
</body>
</html>
